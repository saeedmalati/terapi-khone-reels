<!doctype html>
<html
  lang="fa"
  data-composition-variables='[
    {"id":"title","type":"string","label":"تیتر","default":"رفیق"},
    {"id":"l1","type":"string","label":"جمله ۱","default":"یه روزایی بود…"},
    {"id":"l2a","type":"string","label":"جمله ۲ (خط اول)","default":"که دلم فقط با تو"},
    {"id":"l2b","type":"string","label":"جمله ۲ (خط دوم)","default":"آروم می‌گرفت"},
    {"id":"l3a","type":"string","label":"جمله ۳ (خط اول)","default":"هرجا کم آوردم"},
    {"id":"l3b","type":"string","label":"جمله ۳ (خط دوم)","default":"تو بودی"},
    {"id":"l4","type":"string","label":"جمله ۴","default":"بی‌منت، بی‌حساب"},
    {"id":"l5","type":"string","label":"جمله ۵","default":"اگه رفیقت هنوز هست…"},
    {"id":"l6a","type":"string","label":"جمله ۶ (خط اول)","default":"امروز بهش پیام بده"},
    {"id":"l6b","type":"string","label":"جمله ۶ (خط دوم)","default":"و بگو هنوز رفیقمی"},
    {"id":"handle","type":"string","label":"واترمارک","default":"terapi_khone"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Nastaliq"; font-weight: 400; src: url("assets/fonts/nastaliq-400.woff2") format("woff2"); }
      @font-face { font-family: "Nastaliq"; font-weight: 700; src: url("assets/fonts/nastaliq-700.woff2") format("woff2"); }
      @font-face { font-family: "Gulzar"; font-weight: 400; src: url("assets/fonts/gulzar-400.woff2") format("woff2"); }
      @font-face { font-family: "Ruqaa"; font-weight: 400; src: url("assets/fonts/ruqaa-400.woff2") format("woff2"); }
      @font-face { font-family: "Ruqaa"; font-weight: 700; src: url("assets/fonts/ruqaa-700.woff2") format("woff2"); }
      @font-face { font-family: "VazLatin"; font-weight: 300; src: url("assets/fonts/vaz-la-300.woff2") format("woff2"); }

      :root { --ink: #fff6e8; --gold: #ffcf8a; --font-display: "Nastaliq"; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0a10; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; direction: rtl; font-family: var(--font-display), serif; }

      #footage { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
      #shade {
        position: absolute; inset: 0; z-index: 2; pointer-events: none;
        background:
          linear-gradient(180deg, rgba(6,5,10,0.70) 0%, rgba(6,5,10,0.45) 18%, rgba(6,5,10,0.55) 35%, rgba(6,5,10,0.62) 50%, rgba(6,5,10,0.35) 70%, rgba(6,5,10,0.65) 100%),
          radial-gradient(ellipse 90% 70% at 50% 45%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.5) 100%);
      }

      #title-wrap { position: absolute; z-index: 5; left: 0; right: 0; top: 250px; text-align: center; }
      #title {
        display: inline-block; font-weight: 700; font-size: 190px; line-height: 1.9; color: var(--ink);
        text-shadow: 0 0 30px rgba(255, 200, 130, 0.45), 0 6px 26px rgba(0, 0, 0, 0.6);
      }
      #rule {
        position: absolute; z-index: 5; top: 640px; left: 50%; width: 240px; height: 3px; margin-left: -120px;
        background: linear-gradient(90deg, rgba(255,207,138,0), var(--gold), rgba(255,207,138,0)); border-radius: 3px;
      }
      .line {
        position: absolute; z-index: 6; left: 50px; right: 50px; top: 700px; text-align: center;
        font-weight: 400; font-size: 86px; line-height: 1.9; color: var(--ink);
        text-shadow: 0 2px 6px rgba(0,0,0,0.7), 0 0 28px rgba(0,0,0,0.55);
      }
      .line.big { font-weight: 700; font-size: 88px; }
      .stack { display: flex; flex-direction: column; align-items: center; gap: 0.62em; }
      .ink {
        /* The mask only covers the element's box, and Nastaliq/Gulzar/Ruqaa dots and tails reach far outside
           the line box. This padding (cancelled by the negative margin, so layout is unchanged) makes the mask
           area big enough that no dot or tail is ever cut. Never remove or shrink it; never use overflow:hidden
           or clip-path on text. */
        display: inline-block; --p: 0%; padding: 0.7em 0.45em; margin: -0.7em -0.45em;
        -webkit-mask-image: linear-gradient(to left, #000 calc(var(--p) - 10%), rgba(0,0,0,0) var(--p));
        mask-image: linear-gradient(to left, #000 calc(var(--p) - 10%), rgba(0,0,0,0) var(--p));
      }
      #handle {
        position: absolute; z-index: 7; left: 0; right: 0; top: 1255px; text-align: center; direction: ltr;
        font-family: "VazLatin", sans-serif; font-weight: 300; font-size: 30px; letter-spacing: 0.08em;
        color: rgba(255, 246, 232, 0.62); text-shadow: 0 1px 6px rgba(0,0,0,0.7);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1920">
      <video id="footage" class="clip" src="assets/footage.mp4" muted playsinline data-start="0" data-duration="24" data-playback-rate="0.8" data-track-index="0"></video>
      <div id="shade" class="clip" data-start="0" data-duration="24" data-track-index="1"></div>

      <div id="title-wrap" class="clip" data-start="0" data-duration="24" data-track-index="2"><span id="title" data-var-text="title">رفیق</span></div>
      <div id="rule" class="clip" data-start="0" data-duration="24" data-track-index="2"></div>

      <div id="l1" class="line clip" data-start="0.5" data-duration="3.4" data-track-index="3"><span class="ink" id="l1i" data-var-text="l1">یه روزایی بود…</span></div>
      <div id="l2" class="line clip" data-start="3.9" data-duration="3.8" data-track-index="3"><div class="stack"><span class="ink" id="l2a" data-var-text="l2a">که دلم فقط با تو</span><span class="ink" id="l2b" data-var-text="l2b">آروم می‌گرفت</span></div></div>
      <div id="l3" class="line clip" data-start="7.7" data-duration="3.6" data-track-index="3"><div class="stack"><span class="ink" id="l3a" data-var-text="l3a">هرجا کم آوردم</span><span class="ink" id="l3b" data-var-text="l3b">تو بودی</span></div></div>
      <div id="l4" class="line clip" data-start="11.3" data-duration="3.4" data-track-index="3"><span class="ink" id="l4i" data-var-text="l4">بی‌منت، بی‌حساب</span></div>
      <div id="l5" class="line clip" data-start="14.7" data-duration="3.4" data-track-index="3"><span class="ink" id="l5i" data-var-text="l5">اگه رفیقت هنوز هست…</span></div>
      <div id="l6" class="line big clip" data-start="18.1" data-duration="5.9" data-track-index="3"><div class="stack"><span class="ink" id="l6a" data-var-text="l6a">امروز بهش پیام بده</span><span class="ink" id="l6b" data-var-text="l6b">و بگو هنوز رفیقمی</span></div></div>

      <div id="handle" class="clip" data-start="0" data-duration="24" data-track-index="4" data-var-text="handle">terapi_khone</div>
      <audio id="music" class="clip" src="assets/music.wav" data-start="0" data-duration="24" data-track-index="5" data-fade-out="1.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { scale: 1.06, opacity: 0.85 }, { scale: 1, opacity: 1, duration: 1.4, ease: "power2.out" }, 0);
      tl.fromTo("#rule", { scaleX: 0.15, opacity: 0.4 }, { scaleX: 1, opacity: 1, duration: 1.6, ease: "power3.out" }, 0);
      tl.to(["#title", "#rule"], { opacity: 0, y: -16, duration: 0.8, ease: "power2.in" }, 23.1);

      const write = (sel, t, d) => tl.fromTo(sel, { "--p": "0%" }, { "--p": "112%", duration: d, ease: "none" }, t);
      function beat(sel, start, dur) {
        tl.fromTo(sel, { y: 18 }, { y: 0, duration: 1.6, ease: "power2.out" }, start);
        tl.fromTo(sel, { opacity: 1 }, { opacity: 0, y: -14, duration: 0.45, ease: "power2.in" }, start + dur - 0.5);
      }
      beat("#l1", 0.5, 3.4);  write("#l1i", 0.5, 1.4);
      beat("#l2", 3.9, 3.8);  write("#l2a", 3.9, 1.1); write("#l2b", 5.0, 1.0);
      beat("#l3", 7.7, 3.6);  write("#l3a", 7.7, 1.0); write("#l3b", 8.7, 0.7);
      beat("#l4", 11.3, 3.4); write("#l4i", 11.3, 1.3);
      beat("#l5", 14.7, 3.4); write("#l5i", 14.7, 1.4);
      tl.fromTo("#l6", { y: 18 }, { y: 0, duration: 2, ease: "power2.out" }, 18.1);
      write("#l6a", 18.1, 1.3); write("#l6b", 19.5, 1.4);
      tl.fromTo("#l6", { opacity: 1 }, { opacity: 0, duration: 0.8, ease: "power2.in" }, 23.1);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
